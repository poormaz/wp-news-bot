# Regex patterns for hardware product names (case-insensitive).
hardware_patterns:
  - '\b(?:geforce\s+)?rtx\s?\d{4}(?:\s?ti)?(?:\s?super)?\b'
  - '\b(?:radeon\s+)?rx\s?\d{4}(?:\s?xtx?|\s?gre)?\b'
  - '\bryzen\s+(?:ai\s+)?\d\s+\d{3,4}x?3?d?\b'
  - '\bcore\s+ultra\s+\d\s+\d{3}[a-z]{0,2}\b'
  - '\b(?:intel\s+)?arc\s+[ab]\d{3}\b'
  - '\bsnapdragon\s+[0-9a-z ]{2,12}\b'
  - '\bdlss\s?\d(?:\.\d)?\b'
  - '\bfsr\s?\d(?:\.\d)?\b'

