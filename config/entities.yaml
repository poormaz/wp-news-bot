# Known entities for cheap, rule-based extraction before any model call.
# The pipeline also learns canonical game names from verified fact sheets
# (stored in the state DB), so this list only needs stable, common names.
#
# Matching ignores case, accents, ™/®, apostrophes, punctuation and a leading "The".
# Add aliases for abbreviations ("GTA 6") that rule-based matching cannot infer.

