# Controlled editorial overrides for News Bot 2.0.
#
# Overrides can make the bot consider or skip stories. They can NEVER bypass fact
# verification: quotes must still be found in the sources, numbers and names must still
# be supported, rumors must still be framed as rumors, and the model fact check still runs.
# Entity names are matched loosely (case, accents, punctuation ignored).

overrides:
  # Article URLs to evaluate on the next run even if they are not in a feed
  # (same effect as manual_links.txt). Each URL is processed once.
  force_include_urls: []

  # Never publish stories about these games/companies/products.
  block_entities: []

  # Regular expressions; matching article URLs or headlines are ignored.
  block_url_patterns: []
  block_title_patterns:
    - '\bwordle\b'
    - '\bconnections (?:hints|answers)\b'

  # For these entities a single medium-authority source is enough even for high-risk stories
  # (rumors, allegations, layoffs, closures...). Ordinary news already accepts one medium source
  # (NEWSBOT_SINGLE_SOURCE_LOW_RISK_MIN_AUTHORITY); the article must still attribute it.
  allow_single_source_entities: []

  # Rumors about these entities may be published with one origin
  # (they must still be framed as unconfirmed in the title and text).
  allow_rumor_entities: []

  # Ranking boost for games Poormaz cares about most (localization pages get a boost automatically).
  priority_entities: []

# Extra headline topics (regular expressions, case-insensitive) that make a story high-risk, so a single
# source needs NEWSBOT_SINGLE_SOURCE_MIN_AUTHORITY (default high) instead of the low-risk level. Built-in
# topics: allegations, lawsuits, layoffs, strikes, closures, cancellations, acquisitions, leaks, rumors.
high_risk_patterns: []

# Official spellings enforced in names written in Latin script (applied to the model's text and to the
# fact sheet it reads; source quotes are verified before this and are never changed). Some press
# material styles names in capitals ("XBOX"); Poormaz articles use one consistent form.
display_names:
  XBOX: Xbox
  PLAYSTATION: PlayStation
  NINTENDO: Nintendo
