# صف نقدهای Poormaz
# ------------------
# هر آیتم داخل «reviews» یک پرونده‌ی نقد است. فیلدها:
#
#   game            (الزامی) نام بازی.
#   platform        (الزامی) پلتفرمی که این پرونده مخصوص آن است، مثلاً
#                   "PC" یا "PS5". نمره‌ی متاکریتیک و امتیاز نهایی فقط
#                   برای همین پلتفرم محاسبه می‌شود؛ نسخه‌های دیگر با هم
#                   قاطی نمی‌شوند. برای هر پلتفرم یک آیتم جدا بسازید.
#   release_date    (اختیاری) تاریخ عرضه، مثلاً "2026-03-19".
#   game_status     (اختیاری، پیش‌فرض: Released) وضعیت عرضه‌ی بازی. یکی از:
#                   Released, Early Access, Remaster, Remake,
#                   Definitive Edition, GOTY Edition, DLC, Expansion, Port
#                   یا هر متن دیگری (در آن صورت همان متن به‌عنوان برچسب
#                   استفاده می‌شود، بدون رد شدن پرونده).
#   metacritic_url  (الزامی) لینک صفحه‌ی متاکریتیکِ همین پلتفرم.
#   review_urls     (الزامی) لینک نقدهای منتخب.
#
# نکته‌ی مهم درباره‌ی review_urls: بات دیگر صرفاً تعداد لینک‌های این فهرست را
# نمی‌شمارد. بعد از دریافت و تحلیل هر لینک، فقط منابعی که واقعاً شواهد
# قابل‌دسته‌بندی کافی داده‌اند («acceptable») به حداقل REVIEW_MIN_SOURCES شمرده
# می‌شوند. اگر یک لینک با خطای HTTP (مثل 403) رد شود، یا صفحه بارگیری شود ولی
# عملاً شاهد قابل‌استفاده‌ای استخراج نشود، همان منبع نادیده گرفته می‌شود -- حتی
# اگر در این فایل ۵ لینک نوشته باشید. اگر تعداد منابع واقعاً قابل‌استفاده کمتر
# از حد لازم باشد، بات هیچ مقاله‌ای نمی‌سازد و به‌جایش یک گزارش
# «{game}-INCOMPLETE.json» می‌سازد که دقیقاً می‌گوید کدام منبع رد شد و چرا.
# به همین دلیل، برای اطمینان بهتر است ۶ تا ۷ لینک بگذارید تا حتی با افت یکی دو
# منبع، باز هم به حداقل برسید.
#
# سایت‌های پیشنهادی: IGN, GameSpot, PC Gamer, Wccftech, Eurogamer,
# Game Informer, VG247, GamesRadar+, Destructoid، و در صورت نیاز منابع معتبر
# دیگر (مثل TheGamer یا GameRant). بات پوشش این فهرست را در کنسول گزارش
# می‌دهد و اگر منبعی جا افتاده باشد، پیشنهاد می‌دهد.
#
# گزینه‌های اختیاری بیشتر (برای بازخوانی شواهد):
#   refresh_evidence: true             -> اجبار به استخراج تازه‌ی همه‌ی منابع
#   refresh_incomplete_evidence: true  -> فقط منابعی که کیفیت‌شان ضعیف بود

reviews:
  - game: "Crimson Desert"
    platform: "PC"
    release_date: "2026-03-19"
    game_status: "Released"
    metacritic_url: "https://www.metacritic.com/game/crimson-desert/"
    review_urls:
      - "https://www.destructoid.com/reviews/crimson-desert-review/"
      - "https://www.pcgamer.com/games/action/crimson-desert-review/"
      - "https://wccftech.com/review/crimson-desert-review-blissfully-lost-in-pywell/"
      - "https://gameinformer.com/review/crimson-desert/open-world-overload"
      - "https://gamerant.com/crimson-desert-review/"
      - "https://www.thegamer.com/crimson-desert-review/"
      # GameSpot (403 در آخرین اجرا) و GamesRadar+ (صفر شاهد قابل‌استفاده در
      # آخرین اجرا) عمداً از این فهرست حذف شده‌اند تا وقتی سالم بودنشان دوباره
      # تأیید نشده، دوباره امتحان نشوند. Wccftech هم در آخرین اجرا با وضعیت
      # manual_review و فقط ۱ شاهد ثبت شده بود؛ اگر این بار هم همین‌طور ماند،
      # ۶ منبع بالا فقط ۵ منبع سالم می‌دهند که باز هم کافی است، اما بهتر است
      # جداگانه بررسی شود که چرا استخراج Wccftech ضعیف مانده.
