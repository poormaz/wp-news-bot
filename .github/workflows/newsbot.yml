name: WP News Bot

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"   # هر 6 ساعت (UTC)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check secrets (safe)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python - << 'PY'
          import os
          for k in ["WP_BASE_URL","WP_USERNAME","WP_APP_PASSWORD","OPENAI_API_KEY"]:
              v = os.getenv(k, "")
              print(k, "OK" if v else "MISSING", "len=", len(v))
          PY

      - name: Run bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_POST_STATUS: draft
          WP_CATEGORY_ID: "0"
          MAX_POSTS_PER_RUN: "3"
          LANG: "fa"
          PYTHONUNBUFFERED: "1"
        run: |
          python -u bot.py
