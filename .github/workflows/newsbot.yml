name: wp-news-bot

on:
  workflow_dispatch:
  schedule:
    # زمان‌ها UTC هستند
    - cron: "0 * * * *" # هر ساعت

concurrency:
  group: wp-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check secrets (safe)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini

          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python - << 'PY'
          import os
          for k in ["WP_BASE_URL","WP_USERNAME","WP_APP_PASSWORD","OPENAI_API_KEY","OPENAI_MODEL","PEXELS_API_KEY"]:
              v = os.getenv(k, "")
              print(k, "OK" if v else "MISSING", "len=", len(v))
          PY

      # فقط GET (هیچ پستی ساخته نمی‌شود)
      - name: WP probe (runner, verbose)
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          set -e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"

          echo "=== WP_BASE_URL ==="
          echo "$WP_BASE_URL"
          echo

          echo "=== 1) GET /wp-json/ (no auth) ==="
          curl -i --max-time 20 -A "$UA" -H "Accept: application/json" \
            "$WP_BASE_URL/wp-json/" | head -n 40
          echo

          echo "=== 2) GET users/me (with Basic Auth) ==="
          curl -i --max-time 20 -A "$UA" -H "Accept: application/json" \
            -u "$WP_USERNAME:$WP_APP_PASSWORD" \
            "$WP_BASE_URL/wp-json/wp/v2/users/me" | head -n 60
          echo

      - name: Run bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini

          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}

          RANKMATH_UPDATER_URL: ${{ secrets.RANKMATH_UPDATER_URL }}
          RANKMATH_UPDATER_TOKEN: ${{ secrets.RANKMATH_UPDATER_TOKEN }}

          # Categories
          CAT_ALL: "2"
          CAT_GAMING: "1"
          CAT_HARDWARE: "19"
          CAT_REVIEWS: "3"

          # Posting
          WP_POST_STATUS: draft
          MAX_POSTS_PER_RUN: "1"
          LANG: "fa"

          # RSS import limit (3 یا 4)
          FEED_ENTRIES_LIMIT: "4"

          # Rotation
          ROTATION_SOURCES: "GameSpot,IGN,DSOGaming,Wccftech,Tom's Hardware,Techpowerup,Windows Central,PC Games Insider,Instant Gaming News"

          # Images
          SET_FEATURED_IMAGE: "1"
          EMBED_IMAGE_IN_CONTENT: "1"

          # Pexels
          PEXELS_ENABLED: "1"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PEXELS_ORIENTATION: "landscape"
          PEXELS_PER_PAGE: "1"

          PYTHONUNBUFFERED: "1"
        run: |
          python -u bot.py
