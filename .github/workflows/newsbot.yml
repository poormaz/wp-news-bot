name: run-bot

on:
  workflow_dispatch:
  schedule:
    # زمان‌ها UTC هستند
    - cron: "0 * * * *"  # هر ساعت یک بار

concurrency:
  group: wp-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # فقط طول envها را چاپ می‌کند، مقدار را نه
      - name: Check secrets (safe)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python - << 'PY'
          import os
          for k in ["WP_BASE_URL","WP_USERNAME","WP_APP_PASSWORD","OPENAI_API_KEY"]:
              v = os.getenv(k, "")
              print(k, "OK" if v else "MISSING", "len=", len(v))
          PY

      # تست WP از داخل Runner (برای اینکه بفهمیم 401/403 از کجاست)
      - name: WP auth probe (runner)
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          echo "users/me status:"
          curl -s -o me.txt -w "%{http_code}\n" -u "$WP_USERNAME:$WP_APP_PASSWORD" \
            "$WP_BASE_URL/wp-json/wp/v2/users/me"
          echo "first 200 chars:"
          head -c 200 me.txt; echo

          echo "posts create status:"
          curl -s -o post.txt -w "%{http_code}\n" -u "$WP_USERNAME:$WP_APP_PASSWORD" \
            -H "Content-Type: application/json" \
            -d '{"title":"API test","content":"Hello","status":"draft"}' \
            "$WP_BASE_URL/wp-json/wp/v2/posts"
          echo "first 200 chars:"
          head -c 200 post.txt; echo

      - name: Run bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_POST_STATUS: draft
          WP_CATEGORY_ID: "0"
          MAX_POSTS_PER_RUN: "3"
          LANG: "fa"
          PYTHONUNBUFFERED: "1"
        run: |
          python -u bot.py
