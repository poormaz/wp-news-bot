name: wp-news-bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *' # هر ساعت (UTC)
    
concurrency:
  group: wp-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Cache bot database (news_cache.db)
        uses: actions/cache@v4
        with:
          path: news_cache.db
          key: wp-news-bot-db-${{ github.run_id }}
          restore-keys: |
            wp-news-bot-db-

      - name: WP probe (GET only)
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          set -e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"

          echo "=== 1) GET /wp-json/ (no auth) ==="
          curl -i --max-time 20 -A "$UA" -H "Accept: application/json" \
            "$WP_BASE_URL/wp-json/" | head -n 40

          echo
          echo "=== 2) GET users/me (with Basic Auth) ==="
          curl -i --max-time 20 -A "$UA" -H "Accept: application/json" \
            -u "$WP_USERNAME:$WP_APP_PASSWORD" \
            "$WP_BASE_URL/wp-json/wp/v2/users/me" | head -n 60

      - name: Run bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini

          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}

          RANKMATH_UPDATER_URL: ${{ secrets.RANKMATH_UPDATER_URL }}
          RANKMATH_UPDATER_TOKEN: ${{ secrets.RANKMATH_UPDATER_TOKEN }}

          # Categories
          CAT_ALL: "2"
          CAT_GAMING: "18"
          CAT_HARDWARE: "19"
          CAT_REVIEWS: "3"

          # Posting
          WP_POST_STATUS: publish
          MAX_POSTS_PER_RUN: "1"
          LANG: "fa"

          # RSS newest N per source
          FEED_ENTRIES_LIMIT: "10"

          # Rotation (اگر خالی کنی، از ترتیب sources.yaml می‌چرخه)
          ROTATION_SOURCES: "Gamingbolt,DSOGaming,Wccftech,PC Gamer,Insider Gaming"

          # Images
          SET_FEATURED_IMAGE: "1"
          EMBED_IMAGE_IN_CONTENT: "1"

          # Pexels
          PEXELS_ENABLED: "1"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PEXELS_ORIENTATION: "landscape"
          PEXELS_PER_PAGE: "1"

          # DEDUP (fuzzy)
          DEDUP_WINDOW_HOURS: "48"
          DEDUP_SIM_THRESHOLD: "0.83"
          DEDUP_WP_CHECK: "1"
          DEDUP_WP_SEARCH_PER_PAGE: "10"
          DEDUP_MIN_TOKENS: "5"

          PYTHONUNBUFFERED: "1"
        run: |
          python -u bot.py
