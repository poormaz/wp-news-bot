name: wp-news-bot

on:
  workflow_dispatch:
  schedule:
    # زمان‌ها UTC هستند
    - cron: "0 * * * *"  # هر ساعت

concurrency:
  group: wp-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # فقط طول secretها را چاپ می‌کند، مقدار را نه
      - name: Check secrets (safe)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          RANKMATH_UPDATER_URL: ${{ secrets.RANKMATH_UPDATER_URL }}
          RANKMATH_UPDATER_TOKEN: ${{ secrets.RANKMATH_UPDATER_TOKEN }}
          CAT_ALL: "2"
          CAT_GAMING: "2,1"
          CAT_HARDWARE: "2,19"
          CAT_REVIEWS: "3"
        run: |
          python - << 'PY'
          import os
          for k in ["WP_BASE_URL","WP_USERNAME","WP_APP_PASSWORD","OPENAI_API_KEY"]:
              v = os.getenv(k, "")
              print(k, "OK" if v else "MISSING", "len=", len(v))
          PY

      # تست دقیق REST API از داخل Runner
      # هدف: بفهمیم /wp-json/ کلاً بسته است یا فقط Authorization باعث بلاک می‌شود
      - name: WP probe (runner, verbose)
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          set -e

          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"

          echo "=== WP_BASE_URL ==="
          echo "$WP_BASE_URL"
          echo

          echo "=== 1) GET /wp-json/ (no auth) ==="
          curl -i --max-time 20 -A "$UA" -H "Accept: application/json" \
            "$WP_BASE_URL/wp-json/" | head -n 40
          echo

          echo "=== 2) GET users/me (with Basic Auth) ==="
          curl -i --max-time 20 -A "$UA" -H "Accept: application/json" \
            -u "$WP_USERNAME:$WP_APP_PASSWORD" \
            "$WP_BASE_URL/wp-json/wp/v2/users/me" | head -n 60
          echo

          echo "=== 3) POST posts (with Basic Auth) ==="
          curl -i --max-time 20 -A "$UA" -H "Accept: application/json" \
            -u "$WP_USERNAME:$WP_APP_PASSWORD" \
            -H "Content-Type: application/json" \
            -d '{"title":"API test","content":"Hello","status":"draft"}' \
            "$WP_BASE_URL/wp-json/wp/v2/posts" | head -n 60
          echo

      - name: Run bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_POST_STATUS: draft
          WP_CATEGORY_ID: "0"
          MAX_POSTS_PER_RUN: "3"
          LANG: "fa"
          PYTHONUNBUFFERED: "1"
        run: |
          python -u bot.py
